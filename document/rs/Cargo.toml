[package]
name = "choreo-document"
version = "2027.0.0-alpha.3"
edition = "2024"
homepage = "https://github.com/SleipnirGroup/Choreo"
repository = "https://github.com/SleipnirGroup/Choreo.git"
authors = ["Sleipnir Group"]
license = "BSD-3-Clause"

[features]
codegen = ["dep:schemars", "dep:typify"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

schemars = { version = "0.8", optional = true }
typify = { version = "0.8.0", optional = true }

[[bin]]
name = "generate"
path = "src/bin/generate.rs"
required-features = ["codegen"]