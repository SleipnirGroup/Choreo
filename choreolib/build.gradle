import org.wpilib.toolchain.*

plugins {
    id 'cpp'
    id 'java'
    id 'google-test'
    id 'org.wpilib.WPILibRepositoriesPlugin' version '2027.0.0'
    id 'org.wpilib.NativeUtils' version '2027.14.3'
    id 'org.wpilib.GradleJni' version '2027.0.0'
    id 'org.wpilib.GradleVsCode' version '2027.0.0'
    id 'com.diffplug.spotless' version '8.4.0'
}

// WPILib Version
ext.wpilibVersion = "2027.0.0-alpha-7+"

repositories {
    mavenCentral()
}
if (project.hasProperty('releaseMode')) {
    wpilibRepositories.addAllReleaseRepositories(project)
} else {
    wpilibRepositories.addAllDevelopmentRepositories(project)
}

var javaVersion = 25

// Apply C++ configuration
apply from: 'config.gradle'

// Apply Java configuration
dependencies {
    implementation "org.wpilib.hal:hal-java:$wpilibVersion"
    implementation "org.wpilib.ntcore:ntcore-java:$wpilibVersion"
    implementation "org.wpilib.telemetry:telemetry-java:$wpilibVersion"
    implementation "org.wpilib.tunables:tunables-java:$wpilibVersion"
    implementation "org.wpilib.wpilibj:wpilibj-java:$wpilibVersion"
    implementation "org.wpilib.wpimath:wpimath-java:$wpilibVersion"
    implementation "org.wpilib.wpiunits:wpiunits-java:$wpilibVersion"
    implementation "org.wpilib.wpiutil:wpiutil-java:$wpilibVersion"

    // This is needed to use wpilibj Filesystem class
    testImplementation "org.wpilib.cscore:cscore-java:$wpilibVersion"
    testImplementation "org.wpilib.cameraserver:cameraserver-java:$wpilibVersion"

    implementation "com.fasterxml.jackson.core:jackson-annotations:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-core:2.19.2"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.19.2"

    implementation "com.google.code.gson:gson:2.13.1"

    testImplementation 'us.hebi.quickbuf:quickbuf-runtime:1.4'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.avaje:avaje-jsonb:3.14'
}

// src/commands2 and src/commands3 both depend on src/main
// src/commands2Test and src/commands3Test additionally depend on their command source set and
// on src/test (shared test helpers)
sourceSets {
    commands2 {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
    commands3 {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
    commands2Test {
        compileClasspath += sourceSets.main.output + sourceSets.commands2.output + sourceSets.test.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
    commands3Test {
        compileClasspath += sourceSets.main.output + sourceSets.commands3.output + sourceSets.test.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
}

configurations {
    commands2CompileOnly.extendsFrom implementation
    commands3CompileOnly.extendsFrom implementation
    commands2TestImplementation.extendsFrom testImplementation
    commands2TestRuntimeOnly.extendsFrom testRuntimeOnly
    commands3TestImplementation.extendsFrom testImplementation
    commands3TestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    commands2CompileOnly "org.wpilib.commandsv2:commandsv2-java:+"
    commands3CompileOnly "org.wpilib:commandsv3-java:+"
    commands2TestImplementation "org.wpilib.commandsv2:commandsv2-java:+"
    commands3TestImplementation "org.wpilib:commandsv3-java:+"
}

['commands2', 'commands3'].each { name ->
    tasks.register("${name}Test", Test) {
        description = "Runs the ${name == 'commands2' ? 'Commands v2' : 'Commands v3'} tests"
        group = 'verification'
        testClassesDirs = sourceSets["${name}Test"].output.classesDirs
        classpath = sourceSets["${name}Test"].runtimeClasspath
        useJUnitPlatform()
        systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        testLogging {
            events "failed"
            exceptionFormat = "full"
        }
        jvmArgs += [
            "--add-opens",
            "java.base/jdk.internal.vm=ALL-UNNAMED",
            "--add-opens",
            "java.base/java.lang=ALL-UNNAMED",
        ]
    }
    check.dependsOn "${name}Test"
}

// Set up java tests
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

if (project.hasProperty('onlylinuxarm64') || project.hasProperty('onlywindowsarm64') || project.hasProperty('onlylinuxsystemcore')) {
    test.enabled = false
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
    options.release = javaVersion
}

// Setup Javadocs to link back to WPILib docs
javadoc {
    options.links("https://docs.oracle.com/en/java/javase/$javaVersion/docs/api/")
    options.links("https://github.wpilib.org/allwpilib/docs/release/java/")
    options.addBooleanOption("Xdoclint:html,missing,reference,syntax", true)
    options.addBooleanOption('html5', true)
    options.addStringOption("charset", "utf-8")
    options.addStringOption("docencoding", "utf-8")
    options.addStringOption("encoding", "utf-8")
    options.linkSource(true)
    failOnError = true

    title = "ChoreoLib API"

    options.addBooleanOption('Werror', true)
}

// Javadocs for the command framework specific jars
['commands2', 'commands3'].each { name ->
    tasks.register("${name}Javadoc", Javadoc) {
        source = sourceSets[name].allJava
        classpath = sourceSets[name].compileClasspath
        destinationDir = file("$buildDir/docs/${name}Javadoc")
        options.links(*javadoc.options.links)
        options.addBooleanOption("Xdoclint:html,missing,reference,syntax", true)
        options.addBooleanOption('html5', true)
        options.addStringOption("charset", "utf-8")
        options.addStringOption("docencoding", "utf-8")
        options.addStringOption("encoding", "utf-8")
        options.linkSource(true)
        failOnError = true
        // javadoc errors out on a source set with only package-info files
        onlyIf {
            source.files.any {
                it.name != 'package-info.java'
            }
        }
        title = "ChoreoLib ${name == 'commands2' ? 'Commands v2' : 'Commands v3'} API"
        options.addBooleanOption('Werror', true)
    }
}

// Set up exports properly
nativeUtils {
    exportsConfigs {
        // Main library is just default empty. This will export everything
        ChoreoLib {
        }
    }
}

ext.getCurrentArch = {
    return NativePlatforms.desktop
}

def systemArch = getCurrentArch()

model {
    components {
        ChoreoLib(NativeLibrarySpec) {
            sources {
                cpp {
                    source {
                        srcDirs 'src/main/native/cpp'
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        srcDirs 'src/main/native/include'
                    }
                }
            }
            nativeUtils.useRequiredLibrary(it, 'wpilib_shared')
        }
    }
    testSuites {
        ChoreoLibTest {
            sources.cpp {
                source {
                    srcDir 'src/test/native/cpp'
                    include '**/*.cpp'
                }
            }

            binaries.all {
                def arch = it.targetPlatform.name
                if (systemArch == arch && it.buildType.name == 'debug') {
                    def filePath = it.tasks.install.installDirectory.get().toString() + File.separatorChar + 'lib'
                    test.dependsOn it.tasks.install
                    test.systemProperty 'java.library.path', filePath
                    test.environment 'LD_LIBRARY_PATH', filePath
                    test.workingDir filePath

                    // The Commands v2 and v3 tests need the same native libraries
                    def installTask = it.tasks.install
                    [
                        'commands2Test',
                        'commands3Test'
                    ].each { testName ->
                        project.tasks.named(testName).configure {
                            dependsOn installTask
                            systemProperty 'java.library.path', filePath
                            environment 'LD_LIBRARY_PATH', filePath
                            workingDir filePath
                        }
                    }
                }
            }

            nativeUtils.useRequiredLibrary(it, "wpilib_shared", "catch2_static")
        }
    }
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**'
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'misc', {
        target fileTree('.') {
            include '**/*.md', '**/.gitignore'
            exclude '**/build/**', '**/build-*/**'
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(4)
        endWithNewline()
    }
}

test {
    dependsOn cleanTest

    useJUnitPlatform()
    testLogging.showStandardStreams = true

    // For reflective access to continuation classes in unit tests
    jvmArgs += [
        "--add-opens",
        "java.base/jdk.internal.vm=ALL-UNNAMED",
        "--add-opens",
        "java.base/java.lang=ALL-UNNAMED",
    ]
}

apply from: 'publish.gradle'

wrapper {
    gradleVersion = '9.4.1'
}
