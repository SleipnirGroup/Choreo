import groovy.json.JsonSlurper

apply plugin: 'maven-publish'

ext.licenseFile = files("$rootDir/LICENSE.txt")

def templateVendorFile = file('vendor_jsons/ChoreoLib2027Alpha.json')
def templateVendorJson = new JsonSlurper().parse(templateVendorFile)
def pubVersion = templateVendorJson.version

def outputsFolder = file("$buildDir/outputs")

def versionFile = file("$outputsFolder/version.txt")

task outputVersions() {
    description = 'Prints the versions of wpilib to a file for use by the downstream packaging project'
    group = 'Build'
    outputs.files(versionFile)

    doFirst {
        buildDir.mkdir()
        outputsFolder.mkdir()
    }

    doLast {
        versionFile.write pubVersion
    }
}

task libraryBuild() {}

build.dependsOn outputVersions

task copyAllOutputs(type: Copy) {
    destinationDir = file("$buildDir/allOutputs")
    from versionFile
    dependsOn outputVersions
}

build.dependsOn copyAllOutputs
copyAllOutputs.dependsOn outputVersions

ext.addTaskToCopyAllOutputs = { task ->
    copyAllOutputs.dependsOn task
    copyAllOutputs.inputs.file task.archiveFile
    copyAllOutputs.from task.archiveFile
}

def artifactGroupId = 'choreo'
def baseArtifactId = 'ChoreoLib'
def zipBaseName = "_GROUP_choreo_ID_${baseArtifactId}-cpp_CLS"
def javaBaseName = "_GROUP_choreo_ID_${baseArtifactId}-java_CLS"

task cppHeadersZip(type: Zip) {
    destinationDirectory = outputsFolder
    archiveBaseName = zipBaseName
    archiveClassifier = "headers"

    from(licenseFile) {
        into '/'
    }

    from('src/main/native/include') {
        into '/'
    }
}

task cppSourceZip(type: Zip) {
    destinationDirectory = outputsFolder
    archiveBaseName = zipBaseName
    archiveClassifier = "sources"

    from(licenseFile) {
        into '/'
    }

    from('src/main/native/cpp') {
        into '/'
    }
}

build.dependsOn cppHeadersZip
addTaskToCopyAllOutputs(cppHeadersZip)
build.dependsOn cppSourceZip
addTaskToCopyAllOutputs(cppSourceZip)

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

// src/main/java becomes choreolib-java
// src/commands2/java becomes choreolib-commands2-java
// src/commands3/java becomes choreolib-commands3-java
def javaVariants = [
    core    : [sourceSet: sourceSets.main, javadoc: tasks.named('javadoc'), artifactId: "${baseArtifactId}-java"],
    commands2: [sourceSet: sourceSets.commands2, javadoc: tasks.named('commands2Javadoc'), artifactId: "${baseArtifactId}-commands2-java"],
    commands3: [sourceSet: sourceSets.commands3, javadoc: tasks.named('commands3Javadoc'), artifactId: "${baseArtifactId}-commands3-java"],
]

def variantArtifactTasks = [:]
javaVariants.each { name, v ->
    def baseName = "_GROUP_choreo_ID_${v.artifactId}_CLS"
    def cap = name.capitalize()
    def classesTask = tasks.named(v.sourceSet.classesTaskName)

    def jarTask = tasks.register("output${cap}Jar", Jar) {
        dependsOn classesTask
        archiveBaseName = baseName
        destinationDirectory = outputsFolder
        from v.sourceSet.output
    }
    def srcTask = tasks.register("output${cap}SourcesJar", Jar) {
        dependsOn classesTask
        archiveBaseName = baseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'sources'
        from v.sourceSet.allSource
    }
    def docTask = tasks.register("output${cap}JavadocJar", Jar) {
        dependsOn v.javadoc
        archiveBaseName = baseName
        destinationDirectory = outputsFolder
        archiveClassifier = 'javadoc'
        from { v.javadoc.get().destinationDir }
    }

    // Standalone jars used by the maven publications
    def pubJar = name == 'core' ? tasks.named('jar') : tasks.register("${name}Jar", Jar) {
        dependsOn classesTask
        archiveBaseName = v.artifactId
        from v.sourceSet.output
    }
    def pubSrc = name == 'core' ? tasks.named('sourcesJar') : tasks.register("${name}SourcesJar", Jar) {
        dependsOn classesTask
        archiveBaseName = v.artifactId
        archiveClassifier = 'sources'
        from v.sourceSet.allSource
    }
    def pubDoc = name == 'core' ? tasks.named('javadocJar') : tasks.register("${name}JavadocJar", Jar) {
        dependsOn v.javadoc
        archiveBaseName = v.artifactId
        archiveClassifier = 'javadoc'
        from { v.javadoc.get().destinationDir }
    }
    variantArtifactTasks[name] = [jar: pubJar, sources: pubSrc, javadoc: pubDoc]

    [jarTask, srcTask, docTask].each { t ->
        build.dependsOn t
        copyAllOutputs.dependsOn t
        copyAllOutputs.from { t.get().archiveFile }
    }
    artifacts {
        tasks.named("assemble") {
            dependsOn(pubJar, pubSrc, pubDoc, jarTask, srcTask, docTask)
        }
    }
}

libraryBuild.dependsOn build

def releasesRepoUrl = "$buildDir/repos/releases"

publishing {
    repositories {
        maven {
            url = releasesRepoUrl
        }
        maven {
            name = "frcmaven"
            url = "https://frcmaven.wpi.edu/artifactory/sleipnirgroup-mvn-release/"
            credentials {
                username = System.getenv("ARTIFACTORY_USERNAME")
                password = System.getenv("ARTIFACTORY_PASSWORD")
            }
        }
    }
}

task cleanReleaseRepo(type: Delete) {
    delete releasesRepoUrl
}

tasks.matching {it != cleanReleaseRepo}.all {it.dependsOn cleanReleaseRepo}

model {
    publishing {
        def taskList = createComponentZipTasks($.components, ['ChoreoLib'], zipBaseName, Zip, project, includeStandardZipFormat)

        publications {
            cpp(MavenPublication) {
                taskList.each {
                    artifact it
                }
                artifact cppHeadersZip
                artifact cppSourceZip

                artifactId = "${baseArtifactId}-cpp"
                groupId = artifactGroupId
                version = pubVersion
            }

            javaVariants.each { name, v ->
                "${name == 'core' ? 'java' : name + 'Java'}"(MavenPublication) {
                    artifact variantArtifactTasks[name].jar
                    artifact variantArtifactTasks[name].sources
                    artifact variantArtifactTasks[name].javadoc

                    artifactId = v.artifactId
                    groupId = artifactGroupId
                    version = pubVersion

                    if (name != 'core') {
                        // Add-ons depend on the core jar; the command framework itself
                        // comes from the user's commands vendordep.
                        pom.withXml {
                            def dep = asNode().appendNode('dependencies').appendNode('dependency')
                            dep.appendNode('groupId', artifactGroupId)
                            dep.appendNode('artifactId', "${baseArtifactId}-java")
                            dep.appendNode('version', pubVersion)
                            dep.appendNode('scope', 'runtime')
                        }
                    }
                }
            }
        }
    }
}
