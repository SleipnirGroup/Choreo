name: Docs

on: [pull_request, push]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v7
        with:
          python-version: 3.14

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install -r docs/requirements.txt

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y doxygen

      - name: Make GCC 14 the default toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 200
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 200

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component clippy,rustfmt

      - name: Copy API docs
        run: ./make-docs.sh

      - run: mkdocs build --dirty
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')

      - run: mkdocs gh-deploy --dirty --force
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

      - uses: actions/upload-artifact@v7
        with:
          name: Documentation
          path: site
