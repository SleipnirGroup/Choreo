name: ChoreoLib

on: [push, pull_request]

jobs:
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build-docker:
    needs: [validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/systemcore-cross-debian:trixie
            artifact-name: Systemcore
            build-options: -Ponlylinuxsystemcore

          - container: wpilib/aarch64-cross-debian:trixie
            artifact-name: Linux-arm64
            build-options: -Ponlylinuxarm64

          - container: wpilib/systemcore-cross-debian:trixie
            artifact-name: Linux-x86_64
            build-options:

    name: C++ and Java - ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Fetch all history and metadata
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25

      - name: Set version (release)
        if: github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
        working-directory: choreolib
        run: sed -i "s/0.0.0/${GITHUB_REF##*v}/g" publish.gradle

      - name: Build with Gradle
        working-directory: choreolib
        run: ./gradlew build ${{ matrix.build-options }}

      - name: Publish with Gradle (release)
        if: github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
        working-directory: choreolib
        run: ./gradlew publish ${{ matrix.build-options }}
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: choreolib/build/allOutputs

  build-host:
    needs: [validation]
    env:
      MACOSX_DEPLOYMENT_TARGET: 13.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact-name: Windows-x86_64
            build-options:

          # FIXME: Link failure on commands library
          # - os: windows-2025
          #   artifact-name: Windows-aarch64
          #   build-options: -Pbuildwinarm64 -Ponlywindowsarm64

          - os: macos-15
            artifact-name: macOS-universal
            build-options:

    name: C++ and Java - ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Fetch all history and metadata
        run: git fetch --prune --unshallow

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 25

      # 6/27/25: an Actions issue makes GITHUB_REF unset on Windows
      - name: Set version (Windows release)
        if: runner.os == 'Windows' && github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ github.ref }}"
          sed -i "s/0.0.0/${tag##*v}/g" publish.gradle
          ./gradlew spotlessApply  # Undo line ending changes from sed
        shell: bash
        working-directory: choreolib

      - name: Set version (macOS release)
        if: runner.os == 'macOS' && github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
        run: sed -i '' "s/0.0.0/${GITHUB_REF##*v}/g" publish.gradle
        working-directory: choreolib

      - name: Build with Gradle
        working-directory: choreolib
        run: ./gradlew build ${{ matrix.build-options }}

      - name: Build with Gradle (release)
        if: github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
        working-directory: choreolib
        run: ./gradlew publish ${{ matrix.build-options }}
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: choreolib/build/allOutputs

  build-python:
    name: Python
    runs-on: ubuntu-24.04
    container: wpilib/systemcore-cross-debian:trixie
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Trust checkout for Git versioning
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - uses: astral-sh/setup-uv@v7

      - run: |
          uv venv
          uv build
          uv pip install dist/*.whl
          uv run pytest
          uv pip install mypy
          uv run mypy --pretty --show-column-numbers .
        working-directory: ./choreolib/py

      - uses: actions/upload-artifact@v7
        with:
          name: Python
          path: ./choreolib/py/dist

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-24.04
    needs: [build-python]
    if: github.repository_owner == 'SleipnirGroup' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/sleipnirgroup-choreolib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "Python"
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
