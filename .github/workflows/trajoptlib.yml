name: TrajoptLib

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-name: Windows x86_64
            cmake-args:
            os: windows-2025
          - artifact-name: Windows aarch64
            cmake-args:
            os: windows-11-arm
          - artifact-name: macOS universal
            cmake-args: -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
            os: macos-15
          - artifact-name: Linux x86_64
            cmake-args:
            os: ubuntu-26.04

    name: C++ - ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - run: cmake -B build -S . -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DTRAJOPT_BUILD_EXAMPLES=ON ${{ matrix.cmake-args }}
        working-directory: trajoptlib

      - run: cmake --build build --config RelWithDebInfo --parallel 4
        working-directory: trajoptlib
        env:
          SCCACHE_GHA_ENABLED: true

      - run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
        working-directory: trajoptlib

      - run: cmake --install build --config RelWithDebInfo --prefix pkg
        working-directory: trajoptlib

      - run: ./build/differential
        if: runner.os != 'Windows'
        working-directory: trajoptlib

      - run: ./build/swerve
        if: runner.os != 'Windows'
        working-directory: trajoptlib

      # FIXME: Returns exit code 1
      # - run: ./build/RelWithDebInfo/differential
      #   if: runner.os == 'Windows'
      #   working-directory: trajoptlib

      # FIXME: Returns exit code 1
      # - run: ./build/RelWithDebInfo/swerve
      #   if: runner.os == 'Windows'
      #   working-directory: trajoptlib

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: trajoptlib/pkg

  rust:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-name: macOS universal
            os: macos-15
          - artifact-name: Linux x86_64
            os: ubuntu-26.04

    name: Rust - ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --component clippy,rustfmt

      - run: cargo build
        working-directory: trajoptlib
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: true

      - run: cargo build --example differential
        working-directory: trajoptlib
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: true

      - run: cargo build --example swerve
        working-directory: trajoptlib
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: true
